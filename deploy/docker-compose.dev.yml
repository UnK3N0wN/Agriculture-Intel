services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agriculture_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Itsbless@24
    ports:
      - "5433:5433"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata_dev: